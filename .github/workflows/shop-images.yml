name: Make shop images
on:
  push:
    branches: [shop-images]
    paths: [shop-images/manifest.json, scripts/make-shop-images.py, .github/workflows/shop-images.yml]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scripts/make-shop-images.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shop-images
          git diff --cached --quiet || (git commit -m "Add Shopee-ready product JPGs" && git push)
