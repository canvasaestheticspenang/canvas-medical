name: Fetch brand photos
on:
  push:
    branches: [partner-brand-pages]
    paths: [assets/brands/manifest.json, scripts/fetch-brand-photos.py, .github/workflows/brand-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scripts/fetch-brand-photos.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/brands
          git diff --cached --quiet || (git commit -m "Add web-sized brand photos" && git push)
